
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geofry Mutangili | Photo Gallery</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1120;color:#f5f0e5;
 font-family:Arial,sans-serif
}
header{
 text-align:center;padding:35px 15px;
 background:#10172a;border-bottom:2px solid #d9b45d
}
h1{color:#e7bd62}
button{
 cursor:pointer;padding:12px 18px;border-radius:8px;
 border:1px solid #d9b45d;font-weight:bold
}
.gold{background:#d9b45d;color:#10172a}
.blue{background:#17243b;color:white}
#gallerySection{display:none}
.container{max-width:1200px;margin:auto;padding:25px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
input,select{
 padding:12px;background:#17243b;color:white;
 border:1px solid #d9b45d;border-radius:8px
}
input{flex:1;min-width:180px}
.gallery{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
 gap:18px
}
.card{
 background:#17243b;border:1px solid #d9b45d;
 border-radius:10px;overflow:hidden
}
.card img{
 width:100%;height:280px;object-fit:cover;display:block
}
.card p{padding:10px;margin:0;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;padding:10px}
.actions button{flex:1;padding:9px 5px}
#viewer,#passwordModal{
 display:none;position:fixed;inset:0;background:#000d;
 z-index:999;align-items:center;justify-content:center;padding:20px
}
#viewer{flex-direction:column}
#viewer img{max-width:95%;max-height:80vh;object-fit:contain}
.modal{
 background:#10172a;border:2px solid #d9b45d;
 border-radius:15px;padding:25px;max-width:420px;width:100%;
 text-align:center
}
.modal input{width:100%;margin:15px 0}
.modal button{width:100%;margin:6px 0}
footer{text-align:center;padding:30px;color:#aaa}
</style>
</head>

<body>

<header>
<h1>Geofry Mutangili</h1>
<h2>My Photo Gallery</h2>
<p>Capture • Preserve • Share</p>
<button class="gold" onclick="showGallery()">VIEW IMAGES</button>
</header>

<div class="container" id="gallerySection">

<div class="controls">
<input id="search" placeholder="Search photographs..." oninput="render()">
<select id="filter" onchange="render()">
<option value="all">All Photos</option>
<option value="first">01–10</option>
<option value="numbers">450–517</option>
<option value="garden">Garden Collection</option>
</select>
</div>

<p id="count"></p>
<div class="gallery" id="gallery"></div>
</div>

<footer>© 2026 Geofry Mutangili | Private Photo Gallery</footer>

<!-- Image viewer -->
<div id="viewer">
<button class="gold" onclick="closeViewer()">CLOSE ✕</button>
<img id="viewerImage">
<p id="viewerName"></p>
</div>

<!-- Password modal -->
<div id="passwordModal">
<div class="modal">
<h2 style="color:#e7bd62">🔒 Enter Password</h2>
<p>Enter the password to download this photograph.</p>
<input id="passwordInput" type="password" placeholder="Enter password">
<button class="gold" onclick="unlockDownload()">UNLOCK & DOWNLOAD</button>
<button class="blue" onclick="closePassword()">CANCEL</button>
<p id="passwordMessage"></p>
</div>
</div>

<script>
const DOWNLOAD_PASSWORD="GEOFRY@254";

const photos=[
"01-confident-portrait.jpg",
"02-grateful-moment.jpg",
"03-classic-portrait.jpg",
"04-thoughtful-presence.jpg",
"05-personal-style.jpg",
"06-library-portrait.jpg",
"07-reading-and-learning.jpg",
"08-campus-moment.png",
"09-library-study.jpg",
"10-curiosity-and-growth.jpg",
"450.jpg","451.jpg","466.jpg","467.jpg","475.jpg",
"478.jpg","479.jpg","515.jpg","516.jpg","517.jpg",
"among-the-palms.jpg","garden-edit-01.jpg",
"green-setting-01.jpg","looking-ahead.jpg",
"moment-to-pause.jpg","natural-composition.jpg",
"palm-garden-study.jpg","quiet-moment.jpg",
"still-in-the-garden.jpg","tropical-lines-01.jpg"
];

let selectedPhoto="";

function showGallery(){
 document.getElementById("gallerySection").style.display="block";
 render();
 document.getElementById("gallerySection").scrollIntoView({behavior:"smooth"});
}

function render(){
 const search=document.getElementById("search").value.toLowerCase();
 const filter=document.getElementById("filter").value;

 const list=photos.filter(name=>{
  let ok=name.toLowerCase().includes(search);

  if(filter==="first")ok=ok&&name.startsWith("0");
  if(filter==="numbers")ok=ok&&/^(450|451|466|467|475|478|479|515|516|517)\./.test(name);
  if(filter==="garden")ok=ok&&(name.includes("garden")||name.includes("palms")||name.includes("tropical"));

  return ok;
 });

 const gallery=document.getElementById("gallery");
 gallery.innerHTML="";
 document.getElementById("count").textContent=list.length+" photographs";

 list.forEach(name=>{
  const card=document.createElement("div");
  card.className="card";

  const img=document.createElement("img");
  img.loading="lazy";
  img.alt=name;
  img.src="./"+encodeURIComponent(name);

  img.onerror=()=>{img.alt="Image unavailable: "+name};

  img.onclick=()=>openViewer(img.src,name);

  const label=document.createElement("p");
  label.textContent=name;

  const actions=document.createElement("div");
  actions.className="actions";

  const view=document.createElement("button");
  view.className="blue";
  view.textContent="VIEW";
  view.onclick=()=>openViewer(img.src,name);

  const download=document.createElement("button");
  download.className="gold";
  download.textContent="🔒 DOWNLOAD";
  download.onclick=()=>askPassword(name);

  actions.append(view,download);
  card.append(img,label,actions);
  gallery.appendChild(card);
 });
}

function openViewer(src,name){
 document.getElementById("viewerImage").src=src;
 document.getElementById("viewerName").textContent=name;
 document.getElementById("viewer").style.display="flex";
}
function closeViewer(){
 document.getElementById("viewer").style.display="none";
 document.getElementById("viewerImage").src="";
}

function askPassword(name){
 selectedPhoto=name;
 document.getElementById("passwordInput").value="";
 document.getElementById("passwordMessage").textContent="";
 document.getElementById("passwordModal").style.display="flex";
 document.getElementById("passwordInput").focus();
}

function closePassword(){
 document.getElementById("passwordModal").style.display="none";
}

function unlockDownload(){
 const password=document.getElementById("passwordInput").value;

 if(password!==DOWNLOAD_PASSWORD){
  document.getElementById("passwordMessage").textContent="❌ Incorrect password!";
  document.getElementById("passwordMessage").style.color="red";
  return;
 }

 const url="./"+encodeURIComponent(selectedPhoto);
 const link=document.createElement("a");
 link.href=url;
 link.download=selectedPhoto;
 document.body.appendChild(link);
 link.click();
 link.remove();

 document.getElementById("passwordMessage").textContent="Download started!";
 document.getElementById("passwordMessage").style.color="#4cff91";
 setTimeout(closePassword,1000);
}

document.getElementById("passwordInput").addEventListener("keydown",e=>{
 if(e.key==="Enter")unlockDownload();
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){closeViewer();closePassword();}
});

render();
</script>
</body>
</html>
